repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          [
            "--baseline",
            "./.secrets.baseline",
            "--exclude-lines",
            "SOME_PATTERN_TO_EXCLUDE|AnotherPatternToExclude|",
          ]
